{% extends "base.html" %}
{% block title %}Password · {{ brand.name }}{% endblock %}
{% block content %}
{% include "steps.html" %}
<section class="sheet">
  <h1>Create a password</h1>
  <p class="lede">This protects the admin pages. Short links stay public.</p>
  <form method="post" action="/setup/password" class="stack">
    {% include "csrf.html" %}
    <label>
      <span>Password</span>
      <input type="password" name="password" required minlength="8" autocomplete="new-password" autofocus>
    </label>
    <label>
      <span>Confirm password</span>
      <input type="password" name="password_confirm" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit">Continue</button>
  </form>
</section>
{% endblock %}
